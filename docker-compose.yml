name: lobehub
services:
  network-service:
    image: alpine
    container_name: lobe-network
    restart: always
    ports:
      - "9000:9000" # RustFS API
      - "${RUSTFS_ADMIN_PORT}:9001" # RustFS Console
      - "${CASDOOR_PORT}:${CASDOOR_PORT}" # Casdoor
      - "${LOBE_PORT}:3210" # LobeHub
      - "${GRAFANA_PORT}:3000" # Grafana
      - "${OTEL_HTTP_PORT}:4318" # OTel Collector HTTP
      - "${OTEL_GRPC_PORT}:4317" # OTel Collector gRPC
    command: tail -f /dev/null
    networks:
      - lobe-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  lobe:
    image: lobehub/lobehub
    container_name: lobehub
    network_mode: "service:network-service"
    depends_on:
      network-service:
        condition: service_started
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      casdoor:
        condition: service_started
      searxng:
        condition: service_started
        required: false
      browserless:
        condition: service_started
        required: false
    environment:
      - "KEY_VAULTS_SECRET=${KEY_VAULTS_SECRET}"
      - "AUTH_SECRET=${AUTH_SECRET}"
      - "DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgresql:5432/${LOBE_DB_NAME}"
      - "INTERNAL_APP_URL=http://localhost:3210"
      - "S3_ENDPOINT=${S3_ENDPOINT}"
      - "S3_BUCKET=${RUSTFS_LOBE_BUCKET}"
      - "S3_ENABLE_PATH_STYLE=1"
      - "S3_ACCESS_KEY=${RUSTFS_ACCESS_KEY}"
      - "S3_ACCESS_KEY_ID=${RUSTFS_ACCESS_KEY}"
      - "S3_SECRET_ACCESS_KEY=${RUSTFS_SECRET_KEY}"
      - "LLM_VISION_IMAGE_USE_BASE64=1"
      - "S3_SET_ACL=0"
      - "SEARCH_PROVIDERS=${SEARCH_PROVIDERS:-searxng}"
      - "SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}"
      # Web Crawler (Browserless) 関連設定
      # CRAWLER_IMPLS を未指定の場合は LobeHub 既定の `naive` クローラのみ有効になる。
      # browserless コンテナを起動して BROWSERLESS_URL を指定した上で、
      # UI / DB 側でクローラとして browserless を選択すると本サービスが使われる。
      - "CRAWLER_IMPLS=${CRAWLER_IMPLS:-naive,browserless}"
      - "BROWSERLESS_URL=${BROWSERLESS_URL:-http://browserless:3000}"
      - "BROWSERLESS_TOKEN=${BROWSERLESS_TOKEN:-}"
      - "BROWSERLESS_BLOCK_ADS=${BROWSERLESS_BLOCK_ADS:-1}"
      - "BROWSERLESS_STEALTH_MODE=${BROWSERLESS_STEALTH_MODE:-0}"
      - "REDIS_URL=redis://redis:6379"
      - "REDIS_PREFIX=lobechat"
      - "REDIS_TLS=0"
      - "OTEL_EXPORTER_OTLP_METRICS_PROTOCOL=http/protobuf"
      - "OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://localhost:4318/v1/metrics"
      - "OTEL_EXPORTER_OTLP_TRACES_PROTOCOL=http/protobuf"
      - "OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://localhost:4318/v1/traces"
    env_file:
      - .env
    restart: always
    entrypoint: >
      /bin/sh -c "
        /bin/node /app/startServer.js &
        LOBE_PID=\$!
        sleep 3
        if [ \$(wget --timeout=5 --spider --server-response \${AUTH_CASDOOR_ISSUER}/.well-known/openid-configuration 2>&1 | grep -c 'HTTP/1.1 200 OK') -eq 0 ]; then
          echo '⚠️Warning: Unable to fetch OIDC configuration from Casdoor'
          echo 'Request URL: \${AUTH_CASDOOR_ISSUER}/.well-known/openid-configuration'
          echo 'Read more at: https://lobehub.com/docs/self-hosting/server-database/docker-compose#necessary-configuration'
          echo ''
          echo '⚠️注意：无法从 Casdoor 获取 OIDC 配置'
          echo '请求 URL: \${AUTH_CASDOOR_ISSUER}/.well-known/openid-configuration'
          echo '了解更多：https://lobehub.com/zh/docs/self-hosting/server-database/docker-compose#necessary-configuration'
          echo ''
        else
          if ! wget -O - --timeout=5 \${AUTH_CASDOOR_ISSUER}/.well-known/openid-configuration 2>&1 | grep 'issuer' | grep \${AUTH_CASDOOR_ISSUER}; then
            printf '❌Error: The Auth issuer is conflict, Issuer in OIDC configuration is: %s' \$(wget -O - --timeout=5 \${AUTH_CASDOOR_ISSUER}/.well-known/openid-configuration 2>&1 | grep -E 'issuer.*' | awk -F '\"' '{print \$4}')
            echo ' , but the issuer in .env file is: \${AUTH_CASDOOR_ISSUER} '
            echo 'Request URL: \${AUTH_CASDOOR_ISSUER}/.well-known/openid-configuration'
            echo 'Read more at: https://lobehub.com/docs/self-hosting/server-database/docker-compose#necessary-configuration'
            echo ''
            printf '❌错误：Auth 的 issuer 冲突，OIDC 配置中的 issuer 是：%s' \$(wget -O - --timeout=5 \${AUTH_CASDOOR_ISSUER}/.well-known/openid-configuration 2>&1 | grep -E 'issuer.*' | awk -F '\"' '{print \$4}')
            echo ' , 但 .env 文件中的 issuer 是：\${AUTH_CASDOOR_ISSUER} '
            echo '请求 URL: \${AUTH_CASDOOR_ISSUER}/.well-known/openid-configuration'
            echo '了解更多：https://lobehub.com/zh/docs/self-hosting/server-database/docker-compose#necessary-configuration'
            echo ''
          fi
        fi
        if [ \$(wget --timeout=5 --spider --server-response \${S3_ENDPOINT}/health 2>&1 | grep -c 'HTTP/1.1 200 OK') -eq 0 ]; then
          echo '⚠️Warning: Unable to fetch RustFS health status'
          echo 'Request URL: \${S3_ENDPOINT}/health'
          echo 'Read more at: https://lobehub.com/docs/self-hosting/server-database/docker-compose#necessary-configuration'
          echo ''
          echo '⚠️注意：无法获取 RustFS 健康状态'
          echo '请求 URL: \${S3_ENDPOINT}/health'
          echo '了解更多：https://lobehub.com/zh/docs/self-hosting/server-database/docker-compose#necessary-configuration'
          echo ''
        fi
        wait $$LOBE_PID
      "

  postgresql:
    image: paradedb/paradedb:latest-pg17
    container_name: lobe-postgres
    ports:
      - "5432:5432"
    volumes:
      - "./postgresql/data:/var/lib/postgresql/data"
    environment:
      - "POSTGRES_DB=${LOBE_DB_NAME}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - lobe-network

  redis:
    image: redis:7-alpine
    container_name: lobe-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1000 --appendonly yes
    volumes:
      - "./redis/data:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always
    networks:
      - lobe-network

  rustfs:
    image: rustfs/rustfs:latest
    container_name: lobe-rustfs
    network_mode: "service:network-service"
    depends_on:
      network-service:
        condition: service_started
    environment:
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
    volumes:
      - "./rustfs/data:/data"
      - "./rustfs/logs:/logs"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:9000/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    command:
      [
        "--access-key",
        "${RUSTFS_ACCESS_KEY}",
        "--secret-key",
        "${RUSTFS_SECRET_KEY}",
        "/data",
      ]
    env_file:
      - .env

  rustfs-init:
    image: minio/mc:latest
    container_name: lobe-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    volumes:
      - ./bucket.config.json:/bucket.config.json:ro
    entrypoint: /bin/sh
    command: -c '
      set -eux;
      echo "S3_ACCESS_KEY=${RUSTFS_ACCESS_KEY}, S3_SECRET_KEY=${RUSTFS_SECRET_KEY}";
      mc --version;
      mc alias set rustfs "http://network-service:9000" "${RUSTFS_ACCESS_KEY}" "${RUSTFS_SECRET_KEY}";
      mc ls rustfs || true;
      mc mb "rustfs/${RUSTFS_LOBE_BUCKET}" --ignore-existing;
      mc admin info rustfs || true;
      mc anonymous set-json "/bucket.config.json" "rustfs/${RUSTFS_LOBE_BUCKET}";
      '
    restart: "no"
    networks:
      - lobe-network
    env_file:
      - .env

  casdoor:
    image: casbin/casdoor:v2.13.0
    container_name: lobe-casdoor
    entrypoint: /bin/sh -c './server --createDatabase=true'
    network_mode: "service:network-service"
    depends_on:
      network-service:
        condition: service_started
      postgresql:
        condition: service_healthy
    environment:
      httpport: ${CASDOOR_PORT}
      RUNNING_IN_DOCKER: "true"
      driverName: "postgres"
      dataSourceName: "user=postgres password=${POSTGRES_PASSWORD} host=postgresql port=5432 sslmode=disable dbname=casdoor"
      runmode: "dev"
    volumes:
      - ./casdoor/init_data.json:/init_data.json
    env_file:
      - .env

  searxng:
    profiles:
      - with-searxng
    image: docker.io/searxng/searxng:latest
    container_name: lobe-searxng
    environment:
      - "SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://searxng:8080/}"
      - "SEARXNG_SECRET=${SEARXNG_SECRET:-change_this_searxng_secret}"
      - "FORCE_OWNERSHIP=${SEARXNG_FORCE_OWNERSHIP:-true}"
    volumes:
      - "./searxng:/etc/searxng:rw"
      - "searxng-cache:/var/cache/searxng"
    restart: always
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    networks:
      - lobe-network
    env_file:
      - .env

  browserless:
    profiles:
      - with-browserless
    image: ghcr.io/browserless/chromium:latest
    container_name: lobe-browserless
    environment:
      - "TOKEN=${BROWSERLESS_TOKEN:-change_this_browserless_token}"
      - "MAX_CONCURRENT_SESSIONS=${BROWSERLESS_MAX_CONCURRENT_SESSIONS:-5}"
      - "MAX_QUEUE_LENGTH=${BROWSERLESS_MAX_QUEUE_LENGTH:-20}"
      - "TIMEOUT=${BROWSERLESS_TIMEOUT_MS:-60000}"
    volumes:
      - "browserless-cache:/tmp"
    restart: always
    networks:
      - lobe-network

  grafana:
    image: grafana/grafana:12.2.0-17419259409
    container_name: lobe-grafana
    network_mode: "service:network-service"
    user: "0"
    depends_on:
      network-service:
        condition: service_started
      tempo:
        condition: service_started
      prometheus:
        condition: service_started
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - "./grafana/data:/var/lib/grafana"
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources

  tempo:
    image: grafana/tempo:2.8.2
    container_name: lobe-tempo
    network_mode: "service:network-service"
    user: "0"
    depends_on:
      network-service:
        condition: service_started
    restart: always
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml
      - "./tempo/data:/var/tempo"
    command: ["-config.file=/etc/tempo.yaml"]

  prometheus:
    image: prom/prometheus
    container_name: lobe-prometheus
    network_mode: "service:network-service"
    user: "0"
    depends_on:
      network-service:
        condition: service_started
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - "./prometheus/data:/prometheus/data"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus/data"
      - "--web.enable-otlp-receiver"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"

  otel-collector:
    image: otel/opentelemetry-collector
    container_name: lobe-otel-collector
    network_mode: "service:network-service"
    depends_on:
      network-service:
        condition: service_started
      tempo:
        condition: service_started
      prometheus:
        condition: service_started
    restart: always
    volumes:
      - ./otel-collector/collector-config.yaml:/etc/otelcol/config.yaml
    command: ["--config", "/etc/otelcol/config.yaml"]

  otel-tracing-test:
    profiles:
      - otel-test
    image: ghcr.io/grafana/xk6-client-tracing:v0.0.9
    container_name: lobe-otel-tracing-test
    network_mode: "service:network-service"
    depends_on:
      network-service:
        condition: service_started
    restart: always
    environment:
      - ENDPOINT=127.0.0.1:4317

  cloudflared:
    image: cloudflare/cloudflared
    command:
      - tunnel
      - --no-autoupdate
      - run
    network_mode: service:network-service
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
      - TUNNEL_TRANSPORT_PROTOCOL=http2
    restart: always

volumes:
  searxng-cache:
  browserless-cache:

networks:
  lobe-network:
    driver: bridge
