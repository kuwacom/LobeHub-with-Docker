# SearXNG local overrides
#
# Keep this file minimal and rely on upstream defaults:
# https://docs.searxng.org/admin/settings/settings.html#use-default-settings

use_default_settings:
  engines:
    remove:
      # - duckduckgo
      # - duckduckgo images
      # - duckduckgo videos
      # - duckduckgo news
      # - duckduckgo weather
      # - google
      # - qwant
      # - qwant news
      # - qwant images
      # - qwant videos
      - startpage
      - startpage news
      - startpage images

general:
  debug: false
  instance_name: "searxng"

search:
  safe_search: 0
  autocomplete: ""
  favicon_resolver: ""
  default_lang: "ja-JP"
  formats:
    - html
    - json

server:
  # Is overwritten by ${SEARXNG_SECRET}
  secret_key: "ultrasecretkey"
  limiter: false
  image_proxy: false
  public_instance: false
  # GET keeps URLs shareable and matches LobeHub's simple SearXNG integration.
  method: "GET"
  # If you publish the local SearXNG UI, override this with the public URL.
  # It can also be overwritten by ${SEARXNG_BASE_URL}.
  # base_url: http://localhost:8080/

valkey:
  url: false

ui:
  default_locale: "ja"
