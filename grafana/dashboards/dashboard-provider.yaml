apiVersion: 1

providers:
  - name: LobeHub Dashboards
    orgId: 1
    folder: LobeHub
    folderUid: lobehub
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
